<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Cartly | Everyday essentials, delivered fast</title>

  <meta
    name="description"
    content="Shop beauty, fragrance and everyday essentials at Cartly. Free delivery on orders over $25."
  >

  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">

  <!-- Link previews -->
  <meta property="og:title" content="Cartly | Everyday essentials, delivered fast">
  <meta
    property="og:description"
    content="Beauty, fragrance and more. Free delivery on orders over $25."
  >
  <meta property="og:image" content="images/hero.svg">
  <meta property="og:type" content="website">

  <!-- Main JavaScript -->
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <!-- Skip link for keyboard users -->
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- Header -->
  <header class="site-header">
    <a href="#/" class="logo" aria-label="Cartly home">
      <img
        src="images/logo.svg"
        alt="Cartly"
        width="160"
        height="40"
      >
    </a>

    <nav aria-label="Main navigation">
      <ul class="nav-list">
        <li>
          <a href="#/" data-route="">Products</a>
        </li>

        <li>
          <a href="#/about" data-route="about">About</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Main content: JavaScript renders each page here -->
  <main id="main" tabindex="-1">
    <div id="app">
      <p>Loading Cartly...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <ul class="footer-links">
      <li>
        <a href="mailto:hello@cartly.example">Contact us</a>
      </li>

      <li>
        <a href="#/about">About Cartly</a>
      </li>
    </ul>

    <p>&copy; <span id="year"></span> Cartly</p>
  </footer>
</body>
</html>
